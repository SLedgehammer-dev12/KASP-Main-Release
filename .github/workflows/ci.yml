name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests-linux:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      KASP_TEST_MODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies for headless Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Install dependencies
        run: python3 -m pip install --upgrade pip && pip install -r requirements.lock.txt
      - name: Run test suite
        run: pytest -v

  tests-win:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      KASP_TEST_MODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.lock.txt
      - name: Run test suite
        run: pytest -v

  tests-mac:
    runs-on: macos-latest
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      KASP_TEST_MODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python3 -m pip install --upgrade pip && pip install -r requirements.lock.txt
      - name: Run test suite
        run: pytest -v

