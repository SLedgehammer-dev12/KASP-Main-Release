name: Build and Release (Win + macOS)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:

  # ── Windows EXE ──────────────────────────────────────────────────────
  release-win:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          python -c "from release_metadata import RELEASE_SPEC_FILENAME; import subprocess; subprocess.run(['pyinstaller', '--clean', RELEASE_SPEC_FILENAME], check=True)"

      - name: Identify Asset & Release Notes
        shell: bash
        run: |
          EXE_NAME=$(python -c "from release_metadata import RELEASE_EXE_NAME; print(RELEASE_EXE_NAME)")
          RELEASE_TAG=$(python -c "from release_metadata import RELEASE_TAG; print(RELEASE_TAG)")
          NOTES_FILE="${RELEASE_TAG}_release_notes.md"
          echo "EXE_PATH=dist/${EXE_NAME}" >> $GITHUB_ENV
          if [ -f "${NOTES_FILE}" ]; then
            echo "NOTES_PATH=${NOTES_FILE}" >> $GITHUB_ENV
            echo "NOTES_FOUND=true" >> $GITHUB_ENV
          else
            echo "NOTES_FOUND=false" >> $GITHUB_ENV
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.EXE_PATH }}
          body_path: ${{ env.NOTES_PATH }}
          generate_release_notes: ${{ env.NOTES_FOUND == 'false' }}

  # ── macOS .app → .dmg ──────────────────────────────────────────────
  release-mac:
    name: Build macOS dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build .app with PyInstaller
        run: |
          SPEC=$(python3 -c "from release_metadata import RELEASE_MAC_SPEC_FILENAME; print(RELEASE_MAC_SPEC_FILENAME)")
          pyinstaller --clean "${SPEC}"

      - name: Package .dmg
        run: |
          APP_NAME=$(python3 -c "from release_metadata import RELEASE_MAC_APP_NAME; print(RELEASE_MAC_APP_NAME)")
          DMG_NAME=$(python3 -c "from release_metadata import RELEASE_MAC_DMG_NAME; print(RELEASE_MAC_DMG_NAME)")

          mkdir -p dist/dmg_tmp
          cp -R "dist/${APP_NAME}" dist/dmg_tmp/
          ln -s /Applications dist/dmg_tmp/Applications

          hdiutil create \
            -volname "${APP_NAME%.app}" \
            -srcfolder dist/dmg_tmp \
            -ov \
            -format UDZO \
            "dist/${DMG_NAME}"

          rm -rf dist/dmg_tmp
          echo "DMG_PATH=dist/${DMG_NAME}" >> $GITHUB_ENV

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DMG_PATH }}
          generate_release_notes: false
