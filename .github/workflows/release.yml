name: Build and Release (Win + macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ── Windows EXE ──────────────────────────────────────────────────────
  release-win:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r KASP/requirements.txt

      - name: Build EXE
        run: |
          cd KASP
          python -c "from release_metadata import RELEASE_SPEC_FILENAME; import subprocess; subprocess.run(['pyinstaller', '--clean', RELEASE_SPEC_FILENAME], check=True)"

      - name: Identify Asset
        shell: bash
        run: |
          cd KASP
          EXE_NAME=$(python -c "from release_metadata import RELEASE_EXE_NAME; print(RELEASE_EXE_NAME)")
          echo "EXE_PATH=KASP/dist/${EXE_NAME}" >> $GITHUB_ENV

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.EXE_PATH }}
          generate_release_notes: true

  # ── macOS .app → .dmg ──────────────────────────────────────────────
  release-mac:
    name: Build macOS dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r KASP/requirements.txt

      - name: Build .app with PyInstaller
        run: |
          cd KASP
          SPEC=$(python3 -c "from release_metadata import RELEASE_MAC_SPEC_FILENAME; print(RELEASE_MAC_SPEC_FILENAME)")
          pyinstaller --clean "${SPEC}"

      - name: Package .dmg
        run: |
          cd KASP
          APP_NAME=$(python3 -c "from release_metadata import RELEASE_MAC_APP_NAME; print(RELEASE_MAC_APP_NAME)")
          DMG_NAME=$(python3 -c "from release_metadata import RELEASE_MAC_DMG_NAME; print(RELEASE_MAC_DMG_NAME)")

          # Fix .app extension if missing
          if [ -d "dist/${APP_NAME}" ] && [ ! -d "dist/${APP_NAME}.app" ]; then
            mv "dist/${APP_NAME}" "dist/${APP_NAME}.app"
          fi
          APP_PATH="dist/${APP_NAME}.app"

          mkdir -p dist/dmg_tmp
          cp -R "${APP_PATH}" dist/dmg_tmp/
          ln -s /Applications dist/dmg_tmp/Applications

          hdiutil create \
            -volname "KASP v1.6.1" \
            -srcfolder dist/dmg_tmp \
            -ov \
            -format UDZO \
            "dist/${DMG_NAME}"

          rm -rf dist/dmg_tmp
          echo "DMG_PATH=KASP/dist/${DMG_NAME}" >> $GITHUB_ENV

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DMG_PATH }}
          generate_release_notes: false
