name: Build and Release Windows EXE

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build Windows Release EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        run: |
          python -c "from release_metadata import RELEASE_SPEC_FILENAME; import subprocess; subprocess.run(['pyinstaller', '--clean', RELEASE_SPEC_FILENAME], check=True)"

      - name: Identify Built Asset
        shell: bash
        run: |
          EXE_NAME=$(python -c "from release_metadata import RELEASE_EXE_NAME; print(RELEASE_EXE_NAME)")
          echo "EXE_PATH=dist/${EXE_NAME}" >> $GITHUB_ENV
          echo "EXE_NAME=${EXE_NAME}" >> $GITHUB_ENV
          echo "Building complete for asset: dist/${EXE_NAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.EXE_PATH }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
