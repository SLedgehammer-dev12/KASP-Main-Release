<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>KASP | Santrifüj Kompresör Simülasyon & Seçim Paketi</title>
  
  <!-- KASP CSS Design System (Zero External CDNs - Air Gapped Ready) -->
  <link rel="stylesheet" href="/static/css/tokens.css" />
  <link rel="stylesheet" href="/static/css/layout.css" />
  <link rel="stylesheet" href="/static/css/components.css" />

  <!-- Offline Vendored Plotly.js -->
  <script src="/static/vendor/plotly.min.js"></script>

  <!-- Offline Vendored 3D WebGL Engine (Three.js & OrbitControls) -->
  <script src="/static/vendor/three.min.js"></script>
  <script src="/static/vendor/OrbitControls.js"></script>
</head>
<body>
  <div id="app">
    <div style="display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; color: #64748B;">
      <span>KASP Web Platformu Başlatılıyor...</span>
    </div>
  </div>

  <!-- Native Modular ES6 Application -->
  <script type="importmap">
    {
      "imports": {
        "/static/src/i18n/locales.js": "/static/src/i18n/locales.js?v=4.1.5"
      }
    }
  </script>
  <script type="module" src="/static/src/main.js?v=4.1.5"></script>

  <!-- Legacy API Token & Protected Endpoint Compatibility Helper -->
  <script>
    function authHeaders() {
      const apiToken = localStorage.getItem('kasp_api_token') || '';
      return {
        'Authorization': `Bearer ${apiToken}`,
        'Content-Type': 'application/json'
      };
    }
    async function _legacyApiCheck() {
      try {
        const response = await fetch('/api/calculate/design', { headers: authHeaders() });
        if (response.status === 401) console.info('Token gerekli');
        const r2 = await fetch('/api/calculate/benchmark', { headers: authHeaders() });
      } catch (_) {}
    }
    // localStorage.setItem('kasp_api_token', ...) support
  </script>
</body>
</html>
